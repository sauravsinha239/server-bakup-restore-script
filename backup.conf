# ==============================================================================
# Disaster Recovery Backup Configuration
# Location: Keep in the same folder as server-backup.sh (chmod 600 backup.conf)
# NOTE: Leave password empty ("") to be prompted interactively in terminal.
# ==============================================================================

# --- General ---
# BACKUP_ROOT="/root/server-backups"
# RETENTION="8"

# --- PostgreSQL ---
PG_HOST="127.0.0.1"
PG_PORT="5432"
PG_USER="postgres"
PG_PASSWORD=""

# --- MongoDB ---
MONGO_HOST="127.0.0.1"
MONGO_PORT="27017"
MONGO_USER=""
MONGO_PASSWORD=""
MONGO_AUTH_DB="admin"

# --- Microsoft SQL Server ---
MSSQL_SERVER="127.0.0.1,1433"
MSSQL_USER="sa"
MSSQL_PASSWORD=""
# MSSQL_BACKUP_DIR="/var/opt/mssql/backup"